<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accurate Bijoy to Unicode Converter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f6f8fd 0%, #e9eeef 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --primary-hover: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --danger-bg: #fee2e2;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.8);
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
            --primary-hover: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --accent-gradient: linear-gradient(135deg, #34d399 0%, #10b981 100%);
            --danger-bg: rgba(239, 68, 68, 0.15);
            --danger-color: #fca5a5;
            --danger-hover: #ef4444;
            --box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif;
            transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease, transform 0.2s ease;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 6%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            box-shadow: var(--box-shadow);
        }

        .stylish-heading {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-controls {
            display: flex;
            gap: 12px;
        }

        .btn-icon {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .btn-icon:hover {
            transform: translateY(-2px);
            border-color: #6366f1;
        }

        .container {
            max-width: 1250px;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
        }

        .converter-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: stretch;
        }

        @media (min-width: 900px) {
            .converter-grid {
                flex-direction: row;
                align-items: center;
            }
        }

        .box {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            padding: 24px;
            border-radius: 24px;
            border: 1px solid var(--card-border);
            box-shadow: var(--box-shadow);
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
        }

        .box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .box-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        textarea {
            width: 100%;
            height: 250px;
            background: rgba(0, 0, 0, 0.02);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 18px;
            border-radius: 16px;
            resize: vertical;
            font-size: 16px;
            line-height: 1.6;
            outline: none;
        }

        textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        textarea.listening-active {
            border-color: #ef4444 !important;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.3) !important;
        }

        .middle-controls {
            display: flex;
            flex-direction: column;
            gap: 14px;
            justify-content: center;
            padding: 10px 0;
            width: 100%;
            max-width: 240px;
            margin: 0 auto;
        }

        .btn-action {
            padding: 14px 20px;
            border-radius: 14px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #ffffff;
            background: var(--primary-gradient);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }

        .btn-action:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 14px 20px -3px rgba(99, 102, 241, 0.4);
        }

        .btn-mic {
            background: var(--accent-gradient);
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);
            padding: 8px 14px;
            font-size: 14px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .btn-clear {
            background: var(--danger-bg);
            color: var(--danger-color);
            border: 1px solid transparent;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            align-self: flex-end;
        }

        .btn-clear:hover {
            color: #ffffff;
            background: var(--danger-hover);
        }

        /* Voice Status Bar with Wave Animation */
        .voice-status-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 12px;
            padding: 8px 15px;
            color: var(--danger-color);
            font-weight: 600;
            font-size: 13px;
        }

        .voice-status-bar.active {
            display: flex;
        }

        .sound-wave {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 18px;
        }

        .wave-bar {
            width: 4px;
            height: 100%;
            background-color: var(--danger-color);
            border-radius: 2px;
            animation: wave 1.2s ease-in-out infinite;
        }

        .wave-bar:nth-child(2) { animation-delay: 0.2s; }
        .wave-bar:nth-child(3) { animation-delay: 0.4s; }
        .wave-bar:nth-child(4) { animation-delay: 0.6s; }

        @keyframes wave {
            0%, 100% { height: 4px; }
            50% { height: 18px; }
        }

        footer {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 24px;
            text-align: center;
            border-top: 1px solid var(--card-border);
            margin-top: 40px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 12px;
        }

        .social-icon {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
            text-decoration: none;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        .whatsapp { background: linear-gradient(135deg, #25D366 0%, #128C7E 100%); }
        .gmail { background: linear-gradient(135deg, #EA4335 0%, #B31412 100%); }

        .recording {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%) !important;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.6) !important;
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <h1 class="stylish-heading" id="app-title">Accurate Bijoy to Unicode Converter</h1>
        <div class="header-controls">
            <button class="btn-icon" id="lang-toggle"><i class="fas fa-globe"></i> বাংলা</button>
            <button class="btn-icon" id="theme-toggle"><i class="fas fa-sun"></i></button>
        </div>
    </header>

    <div class="container">
        <div class="converter-grid">
            
            <div class="box">
                <div class="box-header">
                    <div class="box-title" id="lbl-unicode"><i class="fas fa-keyboard"></i> Unicode Text</div>
                    <button class="btn-action btn-mic" id="mic-btn">
                        <i class="fas fa-microphone"></i> <span id="txt-mic">Voice Typing</span>
                    </button>
                </div>

                <!-- Animated Sound Wave Status -->
                <div class="voice-status-bar" id="voiceStatus">
                    <span id="voiceStatusText"><i class="fas fa-microphone"></i> Listening... Speak in Bangla</span>
                    <div class="sound-wave">
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                    </div>
                </div>

                <textarea id="unicode-text" placeholder="Type Unicode text or speak here..."></textarea>
                <button class="btn-clear" id="clear-unicode-btn">
                    <i class="fas fa-trash-alt"></i> <span id="txt-clear-u">Clear</span>
                </button>
            </div>

            <div class="middle-controls">
                <button class="btn-action" id="btn-to-bijoy">
                    <span id="txt-to-bijoy">Unicode to Bijoy</span> <i class="fas fa-arrow-right"></i>
                </button>
                <button class="btn-action" id="btn-to-unicode">
                    <i class="fas fa-arrow-left"></i> <span id="txt-to-unicode">Bijoy to Unicode</span>
                </button>
            </div>

            <div class="box">
                <div class="box-header">
                    <div class="box-title" id="lbl-bijoy"><i class="fas fa-font"></i> Bijoy Text</div>
                </div>
                <textarea id="bijoy-text" placeholder="Type Bijoy text here..."></textarea>
                <button class="btn-clear" id="clear-bijoy-btn">
                    <i class="fas fa-trash-alt"></i> <span id="txt-clear-b">Clear</span>
                </button>
            </div>

        </div>
    </div>

    <footer>
        <p id="txt-footer" style="font-weight: 600; color: var(--text-muted);">Contact Us</p>
        <div class="social-links">
            <a href="https://wa.me/8801568968385" target="_blank" class="social-icon whatsapp" title="WhatsApp">
                <i class="fab fa-whatsapp"></i>
            </a>
            <a href="mailto:hridulpaul8920@gmail.com" class="social-icon gmail" title="Gmail">
                <i class="fas fa-envelope"></i>
            </a>
        </div>
    </footer>

    <script>
        const translations = {
            bn: {
                title: "নির্ভুল বিজয় টু ইউনিকোড কনভার্টার",
                mic: "ভয়েস টাইপিং",
                listening: "কথা বলুন, জানা যাচ্ছে...",
                toUnicode: "বিজয় টু ইউনিকোড",
                toBijoy: "ইউনিকোড টু বিজয়",
                clear: "মুছে ফেলুন",
                bijoyLbl: "বিজয় টেক্সট (Bijoy)",
                unicodeLbl: "ইউনিকোড টেক্সট (Unicode)",
                bijoyPh: "এখানে বিজয় টেক্সট লিখুন...",
                unicodePh: "এখানে ইউনিকোড টেক্সট লিখুন বা ভয়েস দিন...",
                footer: "যোগাযোগ করুন"
            },
            en: {
                title: "Accurate Bijoy to Unicode Converter",
                mic: "Voice Typing",
                listening: "Listening... Speak in Bangla",
                toUnicode: "Bijoy to Unicode",
                toBijoy: "Unicode to Bijoy",
                clear: "Clear",
                bijoyLbl: "Bijoy Text",
                unicodeLbl: "Unicode Text",
                bijoyPh: "Type Bijoy text here...",
                unicodePh: "Type Unicode text or speak here...",
                footer: "Contact Us"
            }
        };

        // Default Configuration: English & Dark Mode Active
        let currentLang = 'en';

        const themeToggle = document.getElementById('theme-toggle');
        const langToggle = document.getElementById('lang-toggle');
        const micBtn = document.getElementById('mic-btn');
        const voiceStatus = document.getElementById('voiceStatus');
        const voiceStatusText = document.getElementById('voiceStatusText');
        const clearUnicodeBtn = document.getElementById('clear-unicode-btn');
        const clearBijoyBtn = document.getElementById('clear-bijoy-btn');
        const btnToUnicode = document.getElementById('btn-to-unicode');
        const btnToBijoy = document.getElementById('btn-to-bijoy');
        const bijoyText = document.getElementById('bijoy-text');
        const unicodeText = document.getElementById('unicode-text');

        // Dark/Light Theme Switching
        themeToggle.addEventListener('click', () => {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.body.removeAttribute('data-theme');
                themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
            } else {
                document.body.setAttribute('data-theme', 'dark');
                themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
            }
        });

        // Language Switching Logic
        function applyLanguage() {
            langToggle.innerHTML = `<i class="fas fa-globe"></i> ${currentLang === 'bn' ? 'English' : 'বাংলা'}`;
            document.getElementById('app-title').innerText = translations[currentLang].title;
            document.getElementById('txt-mic').innerText = translations[currentLang].mic;
            document.getElementById('txt-to-unicode').innerText = translations[currentLang].toUnicode;
            document.getElementById('txt-to-bijoy').innerText = translations[currentLang].toBijoy;
            document.getElementById('txt-clear-u').innerText = translations[currentLang].clear;
            document.getElementById('txt-clear-b').innerText = translations[currentLang].clear;
            document.getElementById('lbl-bijoy').innerHTML = `<i class="fas fa-font"></i> ${translations[currentLang].bijoyLbl}`;
            document.getElementById('lbl-unicode').innerHTML = `<i class="fas fa-keyboard"></i> ${translations[currentLang].unicodeLbl}`;
            document.getElementById('txt-footer').innerText = translations[currentLang].footer;
            bijoyText.placeholder = translations[currentLang].bijoyPh;
            unicodeText.placeholder = translations[currentLang].unicodePh;
            voiceStatusText.innerHTML = `<i class="fas fa-microphone"></i> ${translations[currentLang].listening}`;
        }

        langToggle.addEventListener('click', () => {
            currentLang = currentLang === 'bn' ? 'en' : 'bn';
            applyLanguage();
        });

        // Clear Box Content
        clearUnicodeBtn.addEventListener('click', () => { unicodeText.value = ''; });
        clearBijoyBtn.addEventListener('click', () => { bijoyText.value = ''; });

        // Advanced Voice Input Handler
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        function initializeRecognition() {
            if (!SpeechRecognition) return null;
            
            const rec = new SpeechRecognition();
            rec.lang = 'bn-BD';
            rec.continuous = true;
            rec.interimResults = true;

            rec.onstart = () => {
                isListening = true;
                micBtn.classList.add('recording');
                voiceStatus.classList.add('active');
                unicodeText.classList.add('listening-active');
            };

            rec.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                    } else {
                        interimTranscript += transcript;
                    }
                }

                if (finalTranscript !== '') {
                    unicodeText.value += finalTranscript;
                }
            };

            rec.onerror = (event) => {
                console.error("Speech Recognition Engine Error:", event.error);
                if (event.error === 'network') {
                    alert(currentLang === 'bn' ? 'ইন্টারনেট সংযোগ চেক করুন। ভয়েস টাইপিংয়ের জন্য গুগল সার্ভারে কানেকশন প্রয়োজন।' : 'Network error! Speech recognition requires an active internet connection.');
                }
                stopListening();
            };

            rec.onend = () => {
                if (isListening) {
                    try { rec.start(); } catch (e) { stopListening(); }
                } else {
                    stopListening();
                }
            };

            return rec;
        }

        function stopListening() {
            isListening = false;
            micBtn.classList.remove('recording');
            voiceStatus.classList.remove('active');
            unicodeText.classList.remove('listening-active');
        }

        micBtn.addEventListener('click', async () => {
            if (!SpeechRecognition) {
                alert(currentLang === 'bn' ? 'আপনার ব্রাউজারে স্পিচ সাপোর্ট নেই। Google Chrome বা Edge ব্যবহার করুন।' : 'Speech Recognition is not supported in this browser. Please use Chrome or Edge.');
                return;
            }

            if (!isListening) {
                try {
                    // Force Audio Stream Permission Test
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    stream.getTracks().forEach(track => track.stop()); // Clean up test stream
                    
                    if (!recognition) {
                        recognition = initializeRecognition();
                    }
                    isListening = true;
                    recognition.start();
                } catch (err) {
                    alert(currentLang === 'bn' ? 'মাইক্রোফোন এক্সেস ব্লক করা আছে অথবা অন্য কোন অ্যাপ ব্যবহার করছে।' : 'Microphone access is blocked or being used by another application.');
                    stopListening();
                }
            } else {
                isListening = false;
                if (recognition) recognition.stop();
                stopListening();
            }
        });

        // Conversion Placeholders
        btnToUnicode.addEventListener('click', () => {
            if(bijoyText.value) unicodeText.value = bijoyText.value;
        });

        btnToBijoy.addEventListener('click', () => {
            if(unicodeText.value) bijoyText.value = unicodeText.value;
        });
    </script>
</body>
</html>
